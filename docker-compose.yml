version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: talentiq
      POSTGRES_PASSWORD: talentiq_secret
      POSTGRES_DB: talentiq
    ports:
      - "6300:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Runs candidate code for the editor's Run button and the AI agents. The public Piston
  # API is whitelist-only since 2026-02-15. Install the languages once: npm run piston:install
  piston:
    image: ghcr.io/engineer-man/piston
    privileged: true # Piston sandboxes each run with isolate (cgroups)
    # Localhost only: Piston has no authentication, anyone reaching it could run code.
    ports:
      - "127.0.0.1:2000:2000"
    environment:
      # Piston's own cap is 1024 chars per stream; ours (20000, integrations/piston) applies instead.
      PISTON_OUTPUT_MAX_SIZE: "65536"
    volumes:
      - piston_packages:/piston/packages
    tmpfs:
      - /piston/jobs:exec,uid=1000,gid=1000,mode=711
    restart: unless-stopped

volumes:
  postgres_data:
  piston_packages:
